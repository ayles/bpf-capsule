name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Nix test matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          enable_kvm: true
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm

      - name: Build and run all in-kernel tests
        run: nix flake check --print-build-logs --max-jobs 1 --cores 4

      - name: Restore benchmark history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: benchmark-cache
          key: benchmark-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: benchmark-${{ runner.arch }}-

      - name: Run in-kernel benchmarks
        run: nix run .#benchmarks

      - name: Publish benchmark summary
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: BPF Capsule
          tool: googlecpp
          output-file-path: benchmark-results/all.json
          external-data-json-path: benchmark-cache/data.json
          summary-always: true
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          fail-on-alert: true

      - name: Save benchmark history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: benchmark-cache
          key: benchmark-${{ runner.arch }}-${{ github.run_id }}
