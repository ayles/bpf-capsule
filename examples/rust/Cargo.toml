# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
[package]
name = "bpf-capsule-rust-example"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# Resolved to the SDK's copy by bpf_capsule_rust_bitcode (a Cargo config patch).
bpf-capsule-rt = { version = "0.1.0", features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
